name: probe
on:
  push:
    branches: [arena/e441b8dd-game-development-3rd-party]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -x
          curl -fsSL -o g.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q g.zip
          { echo "godot: $(./Godot_v4.7.2-stable_linux.x86_64 --headless --version)"; echo "java: $(java -version 2>&1 | head -1)"; echo "sdk: $ANDROID_HOME $(ls $ANDROID_HOME/build-tools | tail -2 | tr '\n' ' ')"; echo "ndk: $(ls $ANDROID_HOME/ndk 2>/dev/null | tr '\n' ' ')"; nproc; free -g | head -2; df -h / | tail -1; } > probe-result.txt
          cat probe-result.txt
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .github/ci && mv probe-result.txt .github/ci/
          git add .github/ci/probe-result.txt && git commit -m "ci: probe result" && git push
